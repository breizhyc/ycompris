# netlify.toml
# Builds de production seulement — plan gratuit : pas de deploy preview / branch deploy.

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Si la commande ignore sort 0, Netlify saute le build.
[context.deploy-preview]
  ignore = "exit 0"

[context.branch-deploy]
  ignore = "exit 0"

[[redirects]]
  from = "/merci"
  to = "/merci/"
  status = 301
  force = true

[[redirects]]
  from = "/ia-esg"
  to = "/ressources/"
  status = 301
  force = true

[[redirects]]
  from = "/ia-esg/"
  to = "/ressources/"
  status = 301
  force = true

[[redirects]]
  from = "/ia-esg/*"
  to = "/ressources/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/methode"
  to = "/livre/"
  status = 301
  force = true

[[redirects]]
  from = "/methode/"
  to = "/livre/"
  status = 301
  force = true

[[redirects]]
  from = "/faq"
  to = "/expertise/"
  status = 301
  force = true

[[redirects]]
  from = "/faq/"
  to = "/expertise/"
  status = 301
  force = true
